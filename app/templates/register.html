<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | Estoque Marceneiro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <main class="auth-shell auth-shell-single">
        <section class="auth-card auth-card-wide">
            <div>
                <span class="eyebrow">Criar conta</span>
                <h2>Novo acesso ao sistema</h2>
                <p class="muted">Informe o e-mail, receba um codigo e confirme sua conta antes de entrar.</p>
                <p class="muted">O codigo sera enviado para o e-mail informado abaixo.</p>
            </div>

            <form id="registerForm" class="stack-form">
                <label>
                    <span>E-mail</span>
                    <input type="email" id="registerEmail" placeholder="seuemail@empresa.com" required>
                </label>

                <label>
                    <span>Senha</span>
                    <input type="password" id="registerPassword" placeholder="Crie uma senha" required>
                </label>

                <label>
                    <span>Confirmar senha</span>
                    <input type="password" id="registerConfirmPassword" placeholder="Repita a senha" required>
                </label>

                <button type="button" id="sendCodeButton" class="btn btn-secondary btn-block">Enviar codigo de validacao</button>

                <label>
                    <span>Codigo de validacao</span>
                    <input type="text" id="registerCode" maxlength="8" placeholder="ABC12345" required>
                </label>

                <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
            </form>

            <p id="registerMsg" class="form-message"></p>
            <p class="auth-link">Ja possui conta? <a href="/">Voltar para o login</a></p>
        </section>
    </main>

    <script>
        const registerMsg = document.getElementById("registerMsg");
        const sendCodeButton = document.getElementById("sendCodeButton");
        const registerForm = document.getElementById("registerForm");
        let sendingCode = false;
        let verifyingCode = false;

        async function fetchJson(url, payload) {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            let data;
            try {
                data = await response.json();
            } catch (error) {
                throw new Error("Nao foi possivel ler a resposta do servidor.");
            }

            return data;
        }

        function showMessage(message) {
            registerMsg.textContent = message;
        }

        document.getElementById("sendCodeButton").addEventListener("click", async () => {
            if (sendingCode) {
                return;
            }

            const payload = {
                email: document.getElementById("registerEmail").value,
                password: document.getElementById("registerPassword").value,
                confirm_password: document.getElementById("registerConfirmPassword").value
            };

            sendingCode = true;
            sendCodeButton.disabled = true;

            try {
                const data = await fetchJson("/register/send-code", payload);
                showMessage(data.message || "Solicitacao concluida.");
            } catch (error) {
                showMessage(error.message || "Nao foi possivel enviar o codigo. Tente novamente.");
            } finally {
                sendingCode = false;
                sendCodeButton.disabled = false;
            }
        });

        registerForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (verifyingCode) {
                return;
            }

            const payload = {
                email: document.getElementById("registerEmail").value,
                code: document.getElementById("registerCode").value
            };

            verifyingCode = true;

            try {
                const data = await fetchJson("/register/verify", payload);
                showMessage(data.message || "Solicitacao concluida.");

                if (data.success) {
                    setTimeout(() => {
                        window.location.href = "/";
                    }, 1000);
                }
            } catch (error) {
                showMessage(error.message || "Nao foi possivel criar a conta. Tente novamente.");
            } finally {
                verifyingCode = false;
            }
        });
    </script>
</body>
</html>
